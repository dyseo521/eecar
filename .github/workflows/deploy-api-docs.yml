# GitHub Pages는 끈 상태로 둔다 (사용자 결정, 2026-11-06). OpenAPI 명세 생성과 커밋만 한다.
name: Generate API Docs

on:
  push:
    paths:
      - 'shared/schemas/**'
      - 'shared/types/**'
      - 'scripts/generate-openapi.ts'
      - 'docs/index.html'
    branches:
      - main
      - master
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write    # For committing generated spec

concurrency:
  group: 'api-docs'
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      spec_changed: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install shared dependencies
        run: cd shared && npm ci

      - name: Build shared package
        run: cd shared && npm run build

      - name: Generate OpenAPI spec
        run: npx tsx scripts/generate-openapi.ts

      - name: Commit generated spec
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: auto-generate OpenAPI spec from Zod schemas'
          file_pattern: 'docs/openapi.yaml'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
