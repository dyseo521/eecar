# 운영 검색 합성 검사의 수동 실행 (DECISION_LOG A-39, A-52)
# 오류 없이 품질이 떨어지는 장애(결과 0건, LLM 폴백, 벡터 누락)는 에러 알림으로 잡히지 않았다 (C-06, C-09, C-26).
# 일정 실행은 EventBridge Scheduler + SearchCanaryFunction으로 옮겼다. GitHub 일정 실행은 "매시"로 등록해도
# 실제 간격이 중앙값 7.0시간, 최대 10.8시간이었다. 이 워크플로는 배포 직후 손으로 확인할 때 쓴다.
name: Search Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run search canary
        id: canary
        env:
          EECAR_API_URL: https://6o4futufni.execute-api.ap-northeast-2.amazonaws.com/prod
          EECAR_CANARY_TOKEN: ${{ secrets.EECAR_CANARY_TOKEN }}
        run: node eval/prod/search-canary.mjs

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAILURES: ${{ steps.canary.outputs.failures }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set; skipping notification"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT=$(printf ':rotating_light: *검색 합성 검사 실패*\n%s\n%s' "${FAILURES:-상세는 실행 기록 참고}" "$RUN_URL")
          jq -n --arg text "$TEXT" '{text: $text}' | curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d @-
