name: Test Pipeline

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  # Backend unit tests
  backend-unit:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Run backend tests
        run: cd backend && npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # Frontend unit tests
  frontend-unit:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Run frontend tests
        run: cd frontend && npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

  # Type checking
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Type check frontend
        run: cd frontend && npm run type-check

      - name: Type check backend
        run: cd backend && npx tsc --noEmit

  # Lint checking
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Lint backend
        run: cd backend && npm run lint

  # Search quality (offline): dataset integrity + regression gate on production search code
  search-eval:
    name: Search Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Eval unit tests
        run: cd eval && uv run pytest -q

      - name: Search quality regression gate (BM25, v1 generated queries)
        run: cd eval && uv run python -m eecar_eval.gate --dataset v1 --system bm25

      - name: Search quality regression gate (BM25, v2 demand-grounded queries)
        run: cd eval && uv run python -m eecar_eval.gate --dataset v2 --system bm25

      # 운영 순위 로직 전체(결합 + 질의 조건). 커밋된 gate-embeddings.json.gz를 써서 AWS가 필요 없다 (DECISION_LOG A-29)
      - name: Search quality regression gate (production ranking, v2)
        run: cd eval && uv run python -m eecar_eval.gate --dataset v2 --system prod-hybrid

      - name: Search quality regression gate (production ranking, v3 blind holdout)
        run: cd eval && uv run python -m eecar_eval.gate --dataset v3 --system prod-hybrid

  # E2E tests (only on master)
  e2e:
    name: E2E Tests
    needs: [backend-unit, frontend-unit]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Docker services
        run: npm run docker:up

      - name: Wait for services
        run: sleep 10

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Docker services
        if: always()
        run: npm run docker:down

  # Summary job
  test-summary:
    name: Test Summary
    needs: [backend-unit, frontend-unit, type-check, lint, search-eval, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Check | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Search Eval | ${{ needs.search-eval.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-unit.result }}" = "failure" ] || [ "${{ needs.frontend-unit.result }}" = "failure" ] || [ "${{ needs.type-check.result }}" = "failure" ] || [ "${{ needs.lint.result }}" = "failure" ] || [ "${{ needs.search-eval.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY

      # 실패한 파이프라인이 아무에게도 알려지지 않던 문제 대응 (master/develop push 한정)
      - name: Notify Slack on failure
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set; skipping notification"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
            -d "{\"text\":\":x: *Test Pipeline failed* on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})\n${RUN_URL}\"}"
